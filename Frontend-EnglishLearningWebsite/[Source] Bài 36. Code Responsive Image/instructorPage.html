<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard</title>
    <link rel="stylesheet" href="css/admin_styles.css">
</head>
<style>
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-right: 20px;
        position: relative;
    }

    .logout-top-right {
        background-color: #ff4d4d;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .logout-top-right:hover {
        background-color: #e60000;
    }
</style>
<body>
    <div class="dashboard">
        <!-- Sidebar với menu điều hướng -->
        <div class="sidebar">
            <div class="logo">Learning English Website - Instructor Page</div>
            <ul class="nav-menu">
                <li class="nav-item active" data-page="dashboard.html">
                    <span>Overview</span>
                </li>
                <li class="nav-item" data-page="article.html">
                    <span>Article management</span>
                </li>
                <li class="nav-item" data-page="chapter.html">
                    <span>Chapter management</span>
                </li>
                <li class="nav-item" data-page="course.html">
                    <span>Course management</span>
                </li>
                <li class="nav-item" data-page="document.html">
                    <span>Document management</span>
                </li>
                <li class="nav-item" data-page="lesson.html">
                    <span>Lesson management</span>
                </li>
                <li class="nav-item" data-page="quizz.html">
                    <span>Quizz management</span>
                </li>
                <li class="nav-item" data-page="studentdotest.html">
                    <span>Submitted Tests</span>
                </li>
                <li class="nav-item" data-page="test.html">
                    <span>Test management</span>
                </li>
                <li class="nav-item" data-page="video.html">
                    <span>Video management</span>
                </li>
                <!-- <li class="nav-item" data-page="status.html">
                    <span>Status management</span>
                </li> -->
            </ul>
        </div>

        <!-- Khu vực nội dung chính -->
        <div class="main-content">
            <div class="header">
                <h1 class="page-title">Overview</h1>
                <button class="logout-top-right" onclick="handleLogout()">Log out</button>
            </div>
            <!-- iframe để hiển thị nội dung -->
            <iframe id="content-frame" class="content-frame" src="dashboard.html"></iframe>
        </div>
    </div>

    <script>
        // Lấy các phần tử DOM cần thiết
        const iframe = document.getElementById('content-frame');
        const pageTitle = document.querySelector('.page-title');
        const menuItems = document.querySelectorAll('.nav-item');

        // Xử lý sự kiện click trên menu
        menuItems.forEach(item => {
            item.addEventListener('click', function () {
                // Xóa trạng thái active từ tất cả các menu items
                menuItems.forEach(i => i.classList.remove('active'));

                // Thêm trạng thái active cho item được click
                this.classList.add('active');

                // Cập nhật tiêu đề trang
                pageTitle.textContent = this.querySelector('span').textContent;

                // Cập nhật src của iframe để load trang mới
                const page = this.getAttribute('data-page');
                iframe.src = page;
            });
        });
        function handleLogout() {
            // Xóa token và user khỏi sessionStorage
            sessionStorage.removeItem("token");
            sessionStorage.removeItem("user");

            // Thông báo và chuyển hướng về trang đăng nhập
            alert("Log out sucessfully!");
            window.location.href = "colorlib-regform-26(llog_in + permission)/colorlib-regform-26/edu_login.html"; // Cập nhật link nếu khác
        }
    </script>
</body>

</html>
