<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<body>
    <div class="container mt-4">
        <h2 class="text-center">Payment management</h2>
        <div class="row mt-2">
            <div class="col-md-10">
                <input type="text" id="searchInput" class="form-control" placeholder="Search payment...">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="openDialog()">Add payment</button>
            </div>
        </div>
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Payment Id</th>
                    <th>Student Name</th>
                    <th>Course Name</th>
                    <th>Payment Date</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Payment information</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Payment Id</label>
                        <input type="text" id="paymentId" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Student</label>
                        <select id="studentId" class="form-control"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <select id="courseId" class="form-control"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Payment Date</label>
                        <input type="datetime-local" id="paymentDate" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" id="amount" class="form-control">
                    </div>
                    <button class="btn btn-success" onclick="savePayment()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Khai báo URL cơ bản của API
        const baseUrl = 'https://localhost:7026/api/Payment';
        const studentApiUrl = 'https://localhost:7026/api/Student/GetStudentById';
        const userApiUrl = 'https://localhost:7026/api/User/GetById';
        const courseApiUrl = 'https://localhost:7026/api/Course/GetCourseById';

        // Tải dữ liệu khi trang được load
        $(document).ready(function () {
            loadData();
            loadStudents();
            loadCourses();
        });

        // Hàm tải danh sách sinh viên
        function loadStudents() {
            $.ajax({
                url: `${baseUrl}/GetList`,
                method: 'GET',
                success: function (data) {
                    let studentPromises = data.map(item =>
                        $.ajax({
                            url: `${studentApiUrl}/${item.studentId}`,
                            method: 'GET'
                        }).then(student =>
                            $.ajax({
                                url: `${userApiUrl}/${student.userId}`,
                                method: 'GET'
                            })
                        )
                    );

                    Promise.all(studentPromises).then(users => {
                        let uniqueStudents = [...new Set(users.map(user => user.userId))];
                        let studentOptions = uniqueStudents.map(userId => {
                            let user = users.find(u => u.userId === userId);
                            return `<option value="${userId}">${user.fullName}</option>`;
                        }).join('');
                        $('#studentId').html(studentOptions);
                    });
                }
            });
        }

        // Hàm tải danh sách khóa học
        function loadCourses() {
            $.ajax({
                url: `${baseUrl}/GetList`,
                method: 'GET',
                success: function (data) {
                    let coursePromises = data.map(item =>
                        $.ajax({
                            url: `${courseApiUrl}/${item.courseId}`,
                            method: 'GET'
                        })
                    );

                    Promise.all(coursePromises).then(courses => {
                        let uniqueCourses = [...new Set(courses.map(course => course.courseId))];
                        let courseOptions = uniqueCourses.map(courseId => {
                            let course = courses.find(c => c.courseId === courseId);
                            return `<option value="${courseId}">${course.courseName}</option>`;
                        }).join('');
                        $('#courseId').html(courseOptions);
                    });
                }
            });
        }

        function loadData() {
            $.ajax({
                url: `${baseUrl}/GetList`,
                method: 'GET',
                success: function (data) {
                    renderTable(data);
                },
                error: function (error) {
                    alert('Lỗi khi tải dữ liệu thanh toán');
                    console.error(error);
                }
            });
        }

        function renderTable(data) {
            // Lưu trữ promises để lấy thông tin chi tiết
            let promises = data.map(item => {
                return Promise.all([
                    $.ajax({
                        url: `${studentApiUrl}/${item.studentId}`,
                        method: 'GET'
                    }).then(student =>
                        $.ajax({
                            url: `${userApiUrl}/${student.userId}`,
                            method: 'GET'
                        })
                    ),
                    $.ajax({
                        url: `${courseApiUrl}/${item.courseId}`,
                        method: 'GET'
                    })
                ]).then(([user, course]) => ({
                    paymentId: item.paymentId,
                    studentName: user.fullName,
                    courseName: course.courseName,
                    paymentDate: item.paymentDate ? new Date(item.paymentDate).toLocaleString() : '',
                    amount: item.amount
                }));
            });

            Promise.all(promises).then(details => {
                let html = details.map(item => `
                    <tr>
                        <td>${item.paymentId}</td>
                        <td>${item.studentName}</td>
                        <td>${item.courseName}</td>
                        <td>${item.paymentDate}</td>
                        <td>${item.amount}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="openDialog('${item.paymentId}')">Sửa</button>
                            <button class="btn btn-danger btn-sm" onclick="deletePayment('${item.paymentId}')">Xóa</button>
                        </td>
                    </tr>
                `).join('');
                $('#dataTable').html(html);
            });
        }

        function openDialog(id = null) {
            $("#editModal").modal("show");

            if (id) {
                $.ajax({
                    url: `${baseUrl}/GetList`,
                    method: 'GET',
                    success: function (data) {
                        const payment = data.find(x => x.paymentId === id);
                        if (payment) {
                            // Lấy thông tin sinh viên và khóa học
                            Promise.all([
                                $.ajax({
                                    url: `${studentApiUrl}/${payment.studentId}`,
                                    method: 'GET'
                                }).then(student =>
                                    $.ajax({
                                        url: `${userApiUrl}/${student.userId}`,
                                        method: 'GET'
                                    })
                                ),
                                $.ajax({
                                    url: `${courseApiUrl}/${payment.courseId}`,
                                    method: 'GET'
                                })
                            ]).then(([user, course]) => {
                                $("#paymentId").val(payment.paymentId).prop("readonly", true);
                                $("#studentId").val(user.userId).prop("disabled", true);
                                $("#courseId").val(course.courseId);
                                $("#paymentDate").val(payment.paymentDate ? new Date(payment.paymentDate).toISOString().slice(0, 16) : '');
                                $("#amount").val(payment.amount);
                            });
                        }
                    }
                });
            } else {
                $("#paymentId").val("").prop("readonly", false);
                $("#studentId").prop("disabled", false).val("");
                $("#courseId").val("");
                $("#paymentDate").val("");
                $("#amount").val("");
            }
        }

        function savePayment() {
            var paymentId = $("#paymentId").val();
            var studentId = $("#studentId").val();
            var courseId = $("#courseId").val();
            var paymentDate = $("#paymentDate").val();
            var amount = $("#amount").val();

            if (!paymentId) {
                alert('Vui lòng nhập Payment Id!');
                return;
            }

            if ($("#paymentId").prop("readonly")) {
                updatePayment(paymentId, studentId, courseId, paymentDate, amount);
            } else {
                insertPayment(paymentId, studentId, courseId, paymentDate, amount);
            }
        }

        function insertPayment(paymentId, studentId, courseId, paymentDate, amount) {
            const url = `paymentId=${encodeURIComponent(paymentId)}&studentId=${encodeURIComponent(studentId)}&courseId=${encodeURIComponent(courseId)}&paymentDate=${encodeURIComponent(paymentDate)}&amount=${encodeURIComponent(amount)}`;

            $.post(`${baseUrl}/Insert?${url}`)
                .done(() => {
                    $("#editModal").modal("hide");
                    loadData();
                    alert('Thêm mới thanh toán thành công!');
                })
                .fail(error => {
                    alert('Lỗi khi thêm thanh toán');
                    console.error(error);
                });
        }

        function updatePayment(paymentId, studentId, courseId, paymentDate, amount) {
            const url = `paymentId=${encodeURIComponent(paymentId)}&studentId=${encodeURIComponent(studentId)}&courseId=${encodeURIComponent(courseId)}&paymentDate=${encodeURIComponent(paymentDate)}&amount=${encodeURIComponent(amount)}`;

            $.post(`${baseUrl}/Update?${url}`)
                .done(() => {
                    $("#editModal").modal("hide");
                    loadData();
                    alert('Cập nhật thanh toán thành công!');
                })
                .fail(error => {
                    alert('Lỗi khi cập nhật thanh toán');
                    console.error(error);
                });
        }

        function deletePayment(paymentId) {
            if (confirm('Bạn có chắc muốn xóa thanh toán này?')) {
                $.post(`${baseUrl}/Delete?paymentId=${paymentId}`)
                    .done(() => {
                        loadData();
                        alert('Xóa thanh toán thành công!');
                    })
                    .fail(error => {
                        alert('Lỗi khi xóa thanh toán');
                        console.error(error);
                    });
            }
        }

        $("#searchInput").on("keyup", function () {
            let value = $(this).val().toLowerCase();
            $("#dataTable tr").filter(function () {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });
    </script>
</body>

</html>
