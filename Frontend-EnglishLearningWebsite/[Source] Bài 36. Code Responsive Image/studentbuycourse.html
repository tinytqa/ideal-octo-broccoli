<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buying Course Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <div class="container mt-4">
        <h2 class="text-center">Buying course management</h2>

        <!-- Thanh tìm kiếm và nút thêm mới -->
        <div class="row mt-2">
            <div class="col-md-10">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search buying course...">
                </div>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="openDialog()">Add buying course</button>
            </div>
        </div>

        <!-- Bảng hiển thị dữ liệu -->
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Enrollment Id</th>
                    <th>Student Name</th>
                    <th>Course Name</th>
                    <th>Enrollment Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>

    <!-- Modal Dialog -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Buying course management</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Enrollment Id</label>
                        <input type="text" id="enrollmentId" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Student</label>
                        <select id="studentId" class="form-control"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <select id="courseId" class="form-control"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Enrollment Date</label>
                        <input type="date" id="enrollmentDate" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="status">Status</label>
                        <select id="status" class="form-control">
                            <option value="">Select status</option>
                            <option value="pending">Pending</option>
                            <option value="purchased">Purchased</option>
                        </select>
                    </div>
                    <button class="btn btn-success" onclick="saveStudentBuyCourse()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Khai báo URL cơ bản của API
        const baseUrl = 'https://localhost:7026/api/StudentBuyCourse';
        const studentApiUrl = 'https://localhost:7026/api/Student/GetStudentById';
        const userApiUrl = 'https://localhost:7026/api/User/GetById';
        const courseApiUrl = 'https://localhost:7026/api/Course/GetCourseById';

        // Tải dữ liệu khi trang được load
        $(document).ready(function () {
            loadData();
            loadStudents();
            loadCourses();
        });

        // Hàm tải danh sách sinh viên
        function loadStudents() {
            $.ajax({
                url: `${baseUrl}/GetList`,
                method: 'GET',
                success: function (data) {
                    let studentPromises = data.map(item =>
                        $.ajax({
                            url: `${studentApiUrl}/${item.studentId}`,
                            method: 'GET'
                        }).then(student =>
                            $.ajax({
                                url: `${userApiUrl}/${student.userId}`,
                                method: 'GET'
                            })
                        )
                    );

                    Promise.all(studentPromises).then(users => {
                        let uniqueStudents = [...new Set(users.map(user => user.userId))];
                        let studentOptions = uniqueStudents.map(userId => {
                            let user = users.find(u => u.userId === userId);
                            return `<option value="${userId}">${user.fullName}</option>`;
                        }).join('');
                        $('#studentId').html(studentOptions);
                    });
                }
            });
        }

        // Hàm tải danh sách khóa học
        function loadCourses() {
            $.ajax({
                url: `${baseUrl}/GetList`,
                method: 'GET',
                success: function (data) {
                    let coursePromises = data.map(item =>
                        $.ajax({
                            url: `${courseApiUrl}/${item.courseId}`,
                            method: 'GET'
                        })
                    );

                    Promise.all(coursePromises).then(courses => {
                        let uniqueCourses = [...new Set(courses.map(course => course.courseId))];
                        let courseOptions = uniqueCourses.map(courseId => {
                            let course = courses.find(c => c.courseId === courseId);
                            return `<option value="${courseId}">${course.courseName}</option>`;
                        }).join('');
                        $('#courseId').html(courseOptions);
                    });
                }
            });
        }

        // Hàm tải dữ liệu từ API
        function loadData() {
            $.ajax({
                url: `${baseUrl}/GetList`,
                method: 'GET',
                success: function (data) {
                    renderTable(data);
                },
                error: function (error) {
                    alert('Lỗi khi tải dữ liệu');
                    console.error(error);
                }
            });
        }

        // Hàm render bảng với dữ liệu
        function renderTable(data) {
            // Lưu trữ promises để lấy thông tin chi tiết
            let promises = data.map(item => {
                return Promise.all([
                    $.ajax({
                        url: `${studentApiUrl}/${item.studentId}`,
                        method: 'GET'
                    }).then(student =>
                        $.ajax({
                            url: `${userApiUrl}/${student.userId}`,
                            method: 'GET'
                        })
                    ),
                    $.ajax({
                        url: `${courseApiUrl}/${item.courseId}`,
                        method: 'GET'
                    })
                ]).then(([user, course]) => ({
                    enrollmentId: item.enrollmentId,
                    studentName: user.fullName,
                    courseName: course.courseName,
                    enrollmentDate: item.enrollmentDate,
                    status: item.status
                }));
            });

            Promise.all(promises).then(details => {
                let html = details.map(item => `
                    <tr>
                        <td>${item.enrollmentId}</td>
                        <td>${item.studentName}</td>
                        <td>${item.courseName}</td>
                        <td>${item.enrollmentDate}</td>
                        <td>${item.status}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="openDialog('${item.enrollmentId}')">Sửa</button>
                        </td>
                    </tr>
                `).join('');
                $('#dataTable').html(html);
            });
        }

        // Hàm mở dialog
        function openDialog(id = null) {
            $("#editModal").modal("show");

            if (id) {
                // Chế độ sửa - load dữ liệu và khóa Enrollment Id
                $.ajax({
                    url: `${baseUrl}/GetList`,
                    method: 'GET',
                    success: function (data) {
                        const studentBuyCourse = data.find(x => x.enrollmentId === id);
                        if (studentBuyCourse) {
                            // Lấy thông tin sinh viên và khóa học
                            Promise.all([
                                $.ajax({
                                    url: `${studentApiUrl}/${studentBuyCourse.studentId}`,
                                    method: 'GET'
                                }).then(student =>
                                    $.ajax({
                                        url: `${userApiUrl}/${student.userId}`,
                                        method: 'GET'
                                    })
                                ),
                                $.ajax({
                                    url: `${courseApiUrl}/${studentBuyCourse.courseId}`,
                                    method: 'GET'
                                })
                            ]).then(([user, course]) => {
                                $("#enrollmentId").val(studentBuyCourse.enrollmentId).prop("readonly", true);
                                $("#studentId").val(user.userId).prop("disabled", true);
                                $("#courseId").val(course.courseId).prop("disabled", true);
                                $("#enrollmentDate").val(studentBuyCourse.enrollmentDate);
                                $("#status").val(studentBuyCourse.status);
                            });
                        }
                    }
                });
            } else {
                // Chế độ thêm mới - xóa form và cho phép nhập Enrollment Id
                $("#enrollmentId").val("").prop("readonly", false);
                $("#studentId").val("");
                $("#courseId").val("");
                $("#enrollmentDate").val("");
                $("#status").val("");
            }
        }

        // Hàm lưu Student Buy Course
        function saveStudentBuyCourse() {
            var enrollmentId = $("#enrollmentId").val();
            var studentId = $("#studentId").val();
            var courseId = $("#courseId").val();
            var enrollmentDate = $("#enrollmentDate").val();
            var status = $("#status").val();

            if (!enrollmentId || !studentId || !courseId || !enrollmentDate || !status) {
                alert('Vui lòng nhập đầy đủ thông tin!');
                return;
            }

            if ($("#enrollmentId").prop("readonly")) {
                updateStudentBuyCourse(enrollmentId, studentId, courseId, enrollmentDate, status);
            } else {
                insertStudentBuyCourse(enrollmentId, studentId, courseId, enrollmentDate, status);
            }
        }

        // Hàm thêm mới Student Buy Course
        function insertStudentBuyCourse(enrollmentId, studentId, courseId, enrollmentDate, status) {
            const url = `${baseUrl}/Insert?enrollmentId=${encodeURIComponent(enrollmentId)}&studentId=${encodeURIComponent(studentId)}&courseId=${encodeURIComponent(courseId)}&enrollmentDate=${encodeURIComponent(enrollmentDate)}&status=${encodeURIComponent(status)}`;

            $.ajax({
                url: url,
                method: 'POST',
                success: function (response) {
                    $("#editModal").modal("hide");
                    loadData();
                    alert('Thêm mới thành công!');
                },
                error: function (error) {
                    alert('Lỗi khi thêm dữ liệu');
                    console.error(error);
                }
            });
        }

        // Hàm cập nhật StudentBuyCourse
        function updateStudentBuyCourse(enrollmentId, studentId, courseId, enrollmentDate, status) {
            const url = `${baseUrl}/Update?enrollmentId=${encodeURIComponent(enrollmentId)}&studentId=${encodeURIComponent(studentId)}&courseId=${encodeURIComponent(courseId)}&enrollmentDate=${encodeURIComponent(enrollmentDate)}&status=${encodeURIComponent(status)}`;

            $.ajax({
                url: url,
                method: 'POST',
                success: function (response) {
                    $("#editModal").modal("hide");
                    loadData();
                    alert('Cập nhật thành công!');
                },
                error: function (error) {
                    alert('Lỗi khi cập nhật dữ liệu');
                    console.error(error);
                }
            });
        }

        // Hàm xóa StudentBuyCourse
        function deleteStudentBuyCourse(id) {
            if (confirm('Bạn có chắc muốn xóa?')) {
                $.ajax({
                    url: `${baseUrl}/Delete?enrollmentId=${encodeURIComponent(id)}`,
                    method: 'POST',
                    success: function (response) {
                        loadData();
                        alert('Xóa thành công!');
                    },
                    error: function (error) {
                        alert('Lỗi khi xóa dữ liệu');
                        console.error(error);
                    }
                });
            }
        }

        // Hàm tìm kiếm
        $("#searchInput").on("keyup", function () {
            let value = $(this).val().toLowerCase();
            $("#dataTable tr").filter(function () {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
