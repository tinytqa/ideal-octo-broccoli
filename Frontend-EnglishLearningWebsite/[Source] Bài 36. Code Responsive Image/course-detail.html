<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Detail</title>
    <link rel="stylesheet" href="css/course-details_styles.css">
</head>

<body>
    <div class="course-container">
        <div class="course-header">
            <h1 id="courseName"></h1>
        </div>
        <div class="course-info">
            <div>
                <p><strong>Course Name:</strong> <span id="displayCourseName"></span></p>
                <p><strong>Instructor:</strong> <span id="instructorName"></span></p>
            </div>
            <div>
                <p class="price" id="price"></p>
            </div>
        </div>
        <div class="course-description">
            <h2>Description</h2>
            <p id="description"></p>
        </div>

        <div class="instructor-bio">
            <h2>About the Instructor</h2>
            <p id="instructorBio"></p>
        </div>

        <div class="course-syllabus">
            <h2>Course Syllabus</h2>
            <ul id="chaptersList" class="syllabus-list"></ul>
        </div>

        <button class="back-button" onclick="window.history.back()">Back to Course List</button>
    </div>

    <script>
        var baseUrl = "https://localhost:7026";
        // Get course ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        // Fetch course details
        fetch(`${baseUrl}/api/Course/GetCourseById/${courseId}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Course not found');
                }
                return response.json();
            })
            .then(course => {
                // Set course details
                document.getElementById('courseName').textContent = course.courseName;
                document.getElementById('displayCourseName').textContent = course.courseName;
                document.getElementById('price').textContent = `$${course.price}`;
                document.getElementById('description').textContent = course.description;

                // Fetch instructor details to get user ID
                return fetch(`${baseUrl}/api/Instructor/GetInstructorById/${course.instructorId}`);
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Instructor not found');
                }
                return response.json();
            })
            .then(instructor => {
                // Fetch user details using userId from instructor
                return Promise.all([
                    fetch(`${baseUrl}/api/User/GetById/${instructor.userId}`),
                    Promise.resolve(instructor)
                ]);
            })
            .then(([userResponse, instructor]) => {
                return Promise.all([
                    userResponse.json(),
                    fetch(`${baseUrl}/api/GetItemByForeignKey/GetChapters/${courseId}`),
                    Promise.resolve(instructor)
                ]);
            })
            .then(([user, chaptersResponse, instructor]) => {
                // Set instructor name from user's full name
                document.getElementById('instructorName').textContent = user.fullName;

                // Set instructor bio
                document.getElementById('instructorBio').textContent = instructor.bio || 'No bio available';

                // Fetch and display chapters
                return chaptersResponse.json();
            })
            .then(chapters => {
                const chaptersList = document.getElementById('chaptersList');

                // Clear any existing chapters
                chaptersList.innerHTML = '';

                // Add chapters to the list
                chapters.forEach(chapter => {
                    const li = document.createElement('li');
                    li.textContent = chapter.chapterTitle;
                    chaptersList.appendChild(li);
                });

                // Add Buy This Course button
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'course-actions';

                const buyButton = document.createElement('button');
                buyButton.className = 'buy-button';
                buyButton.textContent = 'Buy This Course';
                buyButton.onclick = () => {
                    window.location.href = `paymentPage.html?courseId=${courseId}`;
                };

                actionsDiv.appendChild(buyButton);
                document.querySelector('.course-container').appendChild(actionsDiv);
            })
            .catch(error => {
                console.error('Error:', error);
                document.querySelector('.course-container').innerHTML = '<h2>Course, Instructor, or User not found</h2>';
            });
    </script>
</body>

</html>
