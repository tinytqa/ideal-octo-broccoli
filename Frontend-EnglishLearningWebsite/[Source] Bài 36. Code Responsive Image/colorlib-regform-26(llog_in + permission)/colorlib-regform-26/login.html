		$(document).ready(function () {
			$("#btnlogin").click(function (event) {
				event.preventDefault();

				var username = $("#txtuser").val();
				var pw = $("#txtpw").val();
				var url = "https://localhost:7026/api/Login2/login?username="
					+ encodeURIComponent(username) + "&password=" + encodeURIComponent(pw);

				$.ajax({
					url: url,
					type: 'GET',
					success: function (data) {
						if (data.token) {
							window.alert(data.msg);  // Hiển thị thông báo đăng nhập thành công

							// Lưu thông tin người dùng và token vào sessionStorage
							window.sessionStorage.setItem("token", data.token);
							window.sessionStorage.setItem("user", JSON.stringify(data.userFound));

							// Luôn chuyển đến mainpage, xử lý phân quyền bên trong mainpage
							window.location.href = "mainpage.html";
						} else {
							window.alert("No token received!");
						}
					},
					error: function (xhr) {
						window.alert(JSON.parse(xhr.responseText).message);
					}
				});
			});
		});
